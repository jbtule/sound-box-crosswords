name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# One deploy at a time; a newer push waits for the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ubuntu-latest ships Node and npm. The browser loads smol-toml from a CDN;
      # this install is only for the check script.
      - run: npm ci --ignore-scripts
      - run: npm run check
      # Copies the site files to _site/ and stamps the commit for cache busting
      # and the footer badge. See scripts/stamp.mjs.
      - run: node scripts/stamp.mjs "$GITHUB_SHA"
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
