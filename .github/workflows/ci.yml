# Checks every push and PR. Pushes to main then deploy across two hosts (the same split
# as qr-link-pdf):
#
#   Cloudflare Pages  pre-recorded audio (Kokoro "af_heart") for every pack word, Break it down
#                     syllable, and sentence, at sound-box-crosswords.asset-data.stream.
#                     Cloudflare has no bandwidth cap; GitHub Pages has a soft one.
#   GitHub Pages      the app, at tools.tuley.name/sound-box-crosswords/
#
# Audio goes first: the page's audio.json must never point at clips that aren't live yet.
# Only missing clips are generated (see scripts/audio/build.mjs); most pushes reuse them all.
#
# One-time setup for the audio host:
#   Cloudflare: create the Pages project "sound-box-crosswords-audio" (Direct Upload,
#     production branch main) and add the custom domain sound-box-crosswords.asset-data.stream
#   GitHub: repo secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and
#     CLOUDFLARE_ACCOUNT_ID
# Until the secrets exist, audio-deploy skips the upload and the site ships without
# audio.json, so the app uses the device voice.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# One deploy at a time; a newer push waits for the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Where the audio is served from. Must end in a slash.
  ASSET_BASE: https://sound-box-crosswords.asset-data.stream/

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ubuntu-latest ships Node and npm. The browser loads smol-toml from a CDN;
      # this install is only for the scripts.
      - run: npm ci --ignore-scripts
      - run: npm run check
      # Make sure the deploy steps would work, on PRs too.
      - run: node scripts/audio/build.mjs --plan > /dev/null
      - run: node scripts/stamp.mjs "$GITHUB_SHA"

  # Builds the audio host's files. No secrets here: this job runs third-party code
  # (pip packages, the Kokoro model).
  audio-build:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      # kokoro-onnx needs Python < 3.14; the runner's default can be newer. No cache:
      # this job's output gets published (zizmor cache-poisoning).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Downloads clips that are already live, generates only the missing ones
      # (scripts/audio/kokoro.sh, hash-pinned), and writes _audio/ and audio.json.
      - run: node scripts/audio/build.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio
          path: _audio
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-json
          path: audio.json
          retention-days: 1

  # The only job with Cloudflare credentials, and it runs nothing but wrangler.
  audio-deploy:
    needs: audio-build
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      deployed: ${{ steps.creds.outputs.ok }}
    steps:
      - id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare secrets aren't set; skipping the audio upload (the app will use the device voice)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audio
          path: _audio
      - if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: "4.151.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _audio --project-name=sound-box-crosswords-audio --branch=main

  site:
    needs: audio-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only ship audio.json once its clips are live.
      - if: needs.audio-deploy.outputs.deployed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audio-json
      # Copies the site files to _site/ and stamps the commit for cache busting
      # and the footer badge. See scripts/stamp.mjs.
      - run: node scripts/stamp.mjs "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
