name: Add an edition
description: Write a new edition (its own packs, progress and achievements) in the app's format.
title: "Add edition: "
labels: ["edition"]
body:
  - type: markdown
    attributes:
      value: |
        An edition is a separate set of packs: a grade, one classroom's lists, a summer program, a reading level. Each keeps its own progress, achievements, collection and settings, and the first visit asks which one to play.
        It takes two things: an `[[edition]]` entry in [`editions.toml`](https://github.com/jbtule/sound-box-crosswords/blob/main/editions.toml), and a packs file with at least one pack. To add words to an edition that's already there, use "Add a word pack" instead.

        **This page is public.** Don't include a child's name, school, teacher, or anything else personal. Name a classroom generally ("3rd grade, Room 12"), not by its teacher.

        Replace **every** `<...>` placeholder in the boxes below, brackets included.
  - type: markdown
    attributes:
      value: |
        ### 1. The edition entry

        - `id`: lowercase letters, digits and dashes, **at least 8 characters**, descriptive enough that it will never clash with a future edition: `<who>-<year>-<group>` works well, like `grade2-2026-room12`. Progress is saved under it, so it **never changes** once in use.
        - `name`: shown when the app first asks which one to play, and in Settings. Can be long.
        - `short`: on achievement cards and shared pictures. Up to 16 characters, different from every other edition's.
        - `file`: the packs file, `editions/<id>.toml`.
        - `keyboard`: optional. Leave the line out for QWERTY (like a keyboard); `"abc"` starts with the A-to-Z pad, for kids still learning letters.
        - `sound_it_out`: optional, `true` for early readers: a button that says each sound (c-a-t) while its letters light up. Leave the line out otherwise.
  - type: textarea
    id: edition
    attributes:
      label: Edition entry
      render: toml
      value: |
        [[edition]]
        id = "<edition-id>"
        name = "<Edition name>"
        short = "<Short name>"
        file = "editions/<edition-id>.toml"
        keyboard = "<qwerty or abc>"
        sound_it_out = <true or false>
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### 2. The packs file

        One or more `[[pack]]` blocks, written the same way as in the "Add a word pack" form; the header of [`packs.toml`](https://github.com/jbtule/sound-box-crosswords/blob/main/packs.toml) has the full rules.
        - `id` (lowercase, dashes, never changes once in use: `<edition>-<year>-<pack>`), `name` (the pack button), `note` (one line under the buttons, never spelling a pack word).
        - Words one per line, 10 or more: `ba-nan-a 🍌 (buh-nan-uh) "We ate a banana."`
          - Dashes between syllables, split the way a teacher would clap it.
          - A picture only when an emoji clearly shows that word.
          - **Sounds `( )` for every word of 2+ syllables**, using real words or 3+ letter spellings (`(ex-plore)`, `(uh-round)`).
          - **A sentence for every word without a picture**, which must not use any other word from the same pack.
        - With `sound_it_out = true`, add each word's sounds last on the line: `cat 🐈 {c a t}`. Not for sight words.
        - Optionally a `[custom]` block with a starter Custom list for the edition.
  - type: textarea
    id: packs
    attributes:
      label: Packs file
      render: toml
      value: |
        [[pack]]
        id = "<pack-id>"
        name = "<Pack name>"
        note = "<One short line about the pack>"
        words = """
        <syl-la-bles> <emoji> (<how-it-sounds>) "<A sentence that uses the word.>"
        <word> <emoji>
        <word> "<A sentence, needed because this word has no picture.>"
        """
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Before sending
      options:
        - label: I replaced every `<...>` placeholder.
          required: true
        - label: The `id` is at least 8 characters, and the `id` and `short` aren't used by another edition.
          required: true
        - label: Every word with 2 or more syllables has its sounds in `( )`, and every word without a picture has a sentence.
          required: true
        - label: No sentence or note uses another word from its pack.
          required: true
        - label: Nothing here names or describes a real child, school or teacher.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Who it's for (age, reading level), school year, how often new lists come. Photos of the original lists help the review (drag them in here).
