# Kindergarten edition: word packs in the same format as packs.toml (see the notes at the
# top of that file). Words that can be sounded out list their sounds in braces, {c a t}
# (js/phonics.js), for the Sound it out button; sight words don't. Starter packs until the school's own lists are added; school units
# go first, newest at the top.
#
# Run `npm run check` after editing.

[[pack]]
id = "k-short-vowels"
name = "Short vowels"
note = "Three letters with a short vowel sound in the middle. Say each sound."
words = """
cat 🐈 {c a t} ~"Purrrr-fect."
dog 🐕 {d o g}
pig 🐖 {p i g}
sun ☀️ {s u n}
bus 🚌 {b u s} ~"Beep! Beep!"
bed 🛏️ {b e d}
map 🗺️ {m a p}
fox 🦊 {f o x}
bug 🐛 {b u g}
web 🕸️ {w e b}
ant 🐜 {a n t}
bat 🦇 {b a t}
box 📦 {b o x}
ten 🔟 {t e n}
six 6️⃣ {s i x} ~"Seven!"
can 🥫 {c a n}
hat 🎩 {h a t} ~"Looking sharp."
"""

# The class's high-frequency words, one pack per list as it comes home, newest first.
# "I" can't be included: every word needs at least two boxes.
# words_in_text: these words may appear in the note and in each other's sentences, since
# spotting a word printed nearby is part of learning to read it. A clue's own word is
# still blanked.
[[pack]]
id = "k-hfw-2"
name = "High frequency words 2"
note = "More everyday words to know by heart. Listen to the sentence, then spell."
words_in_text = true
school = true
words = """
are "We are friends."
big "An elephant is big." {b i g}
for "This gift is for you."
has "She has a red ball."
have "I have two cats."
he "He can run fast."
here "Come here, puppy!" ~"Present!"
lit-tle (lit-tul) "A mouse is little."
of "I want a cup of milk."
one "I have one nose."
put "Put on your shoes."
said "Mom said yes." ~"Says who?"
saw "I saw a rainbow."
this "This is my bike."
two "I have two hands."
what "What is your name?"
with "Come play with me."
"""

[[pack]]
id = "k-hfw"
name = "High frequency words"
note = "Everyday words to know by heart. Listen to the sentence, then spell."
words_in_text = true
school = true
words = """
my "I like my red hat."
the "We see the big dog."
go "We go to the park."
like "I like to play."
to "I go to school."
we "We like to read."
see "I see a bird."
and "Mom and I go to the store."
# differs: a sight word here, learned by heart from a sentence (no picture or sounds)
can "I can jump high."
is "The sky is blue."
she "She can see the dog."
come "Come to my house." ~"Coming!"
jump "Frogs can jump high." ~"How high?"
look "Look at the moon!" ~"Over there!"
me "Read a book to me."
play "Let's play a game." ~"Tag, you're it!"
want "I want a snack, please." ~"What's the magic word?"
you "I love you." ~"Me?"
"""

# Phonics packs, in teaching order: two letters for one sound, then blends at the start,
# then blends at the end. Short vowels only, so every other sound is one players know.
[[pack]]
id = "k-two-letter-sounds"
name = "Two-letter sounds"
note = "Some sounds need two letters. Listen for each sound, and give it its boxes."
words = """
ship 🚢 {sh i p}
fish 🐟 {f i sh}
shell 🐚 {sh e ll}
chick 🐤 {ch i ck}
check ✔️ {ch e ck}
chess ♟️ {ch e ss} ~"Checkmate!"
bath 🛁 {b a th}
duck 🦆 {d u ck}
sock 🧦 {s o ck} ~"Where's the other one?"
lock 🔒 {l o ck}
rock 🪨 {r o ck}
wing 🪽 {w i ng}
ring 💍 {r i ng}
"""

[[pack]]
id = "k-blends"
name = "Blends"
note = "Two sounds slide together at the start. Say every sound, and give each a box."
words = """
frog 🐸 {f r o g}
crab 🦀 {c r a b} ~"Don't pinch me!"
flag 🚩 {f l a g}
drum 🥁 {d r u m}
swim 🏊 {s w i m}
sled 🛷 {s l e d}
clap 👏 {c l a p}
stop 🛑 {s t o p}
plug 🔌 {p l u g}
trap 🪤 {t r a p} ~"Watch out!"
brick 🧱 {b r i ck}
truck 🚚 {t r u ck}
clock 🕰️ {c l o ck}
"""

[[pack]]
id = "k-ending-blends"
name = "Ending blends"
note = "Two sounds slide together at the end. Hold on to the last sound!"
words = """
nest 🪺 {n e s t}
hand ✋ {h a n d}
tent ⛺ {t e n t}
milk 🥛 {m i l k}
gift 🎁 {g i f t} ~"Is that for me?"
fist ✊ {f i s t}
camp 🏕️ {c a m p}
vest 🦺 {v e s t}
elf 🧝 {e l f}
wink 😉 {w i n=ng k}
plant 🪴 {p l a n t}
skunk 🦨 {s k u n=ng k}
"""

# Hard mode (🥋, opens after any other pack is finished): compound words, two whole words in
# one. Break it down splits them into their two words; no Sound it out (no sounds listed).
[[pack]]
id = "k-compound"
name = "Compound Words"
note = "Two small words make one big word. Keep every sound of both!"
hard = true
words = """
cup-cake 🧁 (cup-cake) ~"Yum!"
pop-corn 🍿 (pop-corn)
snow-man ⛄ (snow-man) ~"I want to build one."
cow-boy 🤠 (cow-boy) ~"Yee haw!"
sun-set 🌅 (sun-set)
rain-bow 🌈 (rain-bow) ~"Ooh, pretty!"
foot-ball 🏈 (foot-ball)
base-ball ⚾ (base-ball)
sail-boat ⛵ (sail-boat)
mail-box 📬 (mail-box)
tooth-brush 🪥 (tooth-brush)
pan-cake 🥞 (pan-cake)
bath-tub 🛁 (bath-tub)
air-plane ✈️ (air-plane)
back-pack 🎒 (back-pack)
snow-flake ❄️ (snow-flake)
lip-stick 💄 (lip-stick)
sea-shell 🐚 (sea-shell)
pea-nut 🥜 (pea-nut)
hand-bag 👜 (hand-bag)
skate-board 🛹 (skate-board)
fire-works 🎆 (fire-works)
"""

# The starter Custom list for this grade (Settings → Custom words). Swap in this week's words.
[custom]
words = """
hop "Bunnies hop in the grass." {h o p}
sit "Please sit on the rug." {s i t}
run "I like to run fast." {r u n}
red "The apple is red." {r e d}
big "An elephant is big." {b i g}
top "The cat sat on top of the box." {t o p}
hot "The soup is too hot." {h o t}
sad "The puppy looks sad." {s a d}
bad "The milk went bad." {b a d}
dad "My dad reads me a story." {d a d}
"""
