<!doctype html>
<!-- The link-preview image (social-card.png, 1200×630). `npm run card` renders this page with
     the app's own stylesheet, so the boxes and colors match. The words here (sound, box,
     dolphin, fish, and the sentence) aren't pack words: the card must never spell an answer. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background-size: 30px 30px; }
  .card { display: flex; align-items: center; gap: 56px; height: 100%; padding: 0 72px; box-sizing: border-box; }
  .words { flex: 1; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: 4.6rem; line-height: 0.98; }
  .tag { margin: 0; font-size: 1.85rem; line-height: 1.35; color: var(--muted); max-width: 15em; text-wrap: balance; }
  .tag b { color: var(--ink); font-weight: 600; }
  .clue { display: grid; grid-template-columns: auto 1fr; gap: 14px 18px; align-items: center; background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 18px 22px; max-width: 540px; }
  .clue .pic { width: 84px; height: 84px; font-size: 3rem; }
  .clue .tools { display: flex; gap: 12px; }
  .clue .tool { font-size: 1.35rem; padding: 10px 18px; border-radius: 14px; }
  .clue .sent { grid-column: 1 / -1; min-height: 0; font-size: 1.45rem; }
  .grid-card { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); padding: 28px; }
  .board { --cell-size: 58px; gap: 6px; grid-template-columns: repeat(5, var(--cell-size)); }
  .cell { font-size: 2rem; }
  .cell.cursor { box-shadow: 0 0 0 4px var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="words">
    <h1>Sound Box <span>Crosswords</span></h1>
    <p class="tag">Spelling practice you can hear: <b>spoken clues</b>, and syllables in color.</p>
    <!-- Like the app's clue bar for a listen-only word: the sound wave, Hear it / Break it down,
         and the spoken sentence with the word left blank. -->
    <div class="clue" aria-hidden="true">
      <div class="pic"><svg class="wave" viewBox="0 0 24 24"><path d="M3 10v4M7 6.5v11M11 3v18M15 7.5v9M19 10v4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></div>
      <div class="tools"><span class="tool">Hear it</span><span class="tool">Break it down</span></div>
      <p class="sent">The ____ jumped out of the waves.</p>
    </div>
  </div>
  <div class="grid-card">
    <!-- box down, sound across, dolphin down (current word, one box empty), fish across (sharing the empty box) -->
    <div class="board" id="board"></div>
  </div>
</div>
<script>
  // [row, col, letter, classes]; an empty letter is the box still to fill. "dolphin" is the
  // current word (the clue's sentence is its), in the app's two syllable bands (dol | phin),
  // with the cursor on the box a speller often drops: dolp_in.
  const A = "sel syl-a", B = "sel syl-b";
  const cells = [
    [0, 1, "b", ""], [2, 1, "x", ""],
    [1, 0, "s", ""], [1, 1, "o", ""], [1, 2, "u", ""], [1, 3, "n", ""], [1, 4, "d", A],
    [2, 4, "o", A], [3, 4, "l", A], [4, 4, "p", B], [5, 4, "", B + " cursor"], [6, 4, "i", B], [7, 4, "n", B],
    [5, 1, "f", ""], [5, 2, "i", ""], [5, 3, "s", ""],
  ];
  const board = document.getElementById("board");
  board.style.gridTemplateRows = "repeat(8, var(--cell-size))";
  for (const [r, c, ch, cls] of cells) {
    const el = document.createElement("div");
    el.className = ("cell " + cls).trim();
    el.style.gridRow = r + 1; el.style.gridColumn = c + 1;
    el.textContent = ch;
    board.appendChild(el);
  }
</script>
</body>
</html>
