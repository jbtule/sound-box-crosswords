<!doctype html>
<!-- The link-preview image (social-card.png, 1200×630). `npm run card` renders this page with
     the app's own stylesheet, so the boxes and colors match. The words here (sound, box,
     dolphin, fish) aren't pack words: the card must never spell an answer. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background-size: 30px 30px; }
  .card { display: flex; align-items: center; gap: 56px; height: 100%; padding: 0 72px; box-sizing: border-box; }
  .words { flex: 1; display: flex; flex-direction: column; gap: 22px; }
  h1 { font-size: 5.2rem; line-height: 0.98; }
  .tag { margin: 0; font-size: 1.85rem; line-height: 1.35; color: var(--muted); max-width: 15em; }
  .tag b { color: var(--ink); font-weight: 600; }
  .clues { display: flex; gap: 14px; }
  .clue { width: 76px; height: 76px; display: grid; place-items: center; font-size: 2.6rem; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); }
  .url { margin: 0; font-size: 1.35rem; font-weight: 600; color: var(--muted); }
  .grid-card { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); padding: 28px; }
  .board { --cell-size: 58px; gap: 6px; grid-template-columns: repeat(5, var(--cell-size)); }
  .cell { font-size: 2rem; }
  .cell.empty { background: var(--accent-soft); border-color: var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="words">
    <h1>Sound Box <span>Crosswords</span></h1>
    <p class="tag">Picture crosswords for spelling. <b>One box per letter</b>, so a missing sound is easy to spot.</p>
    <div class="clues" aria-hidden="true"><div class="clue">🔊</div><div class="clue">📦</div><div class="clue">🐬</div><div class="clue">🐟</div></div>
    <p class="url">tools.tuley.name/sound-box-crosswords</p>
  </div>
  <div class="grid-card">
    <!-- box down, sound across (one box left empty), dolphin down, fish across -->
    <div class="board" id="board"></div>
  </div>
</div>
<script>
  // [row, col, letter, classes]; an empty letter is the box still to fill. "dolphin" shows
  // its two syllables (dol | phin) in the app's two bands.
  const A = "sel syl-a", B = "sel syl-b";
  const cells = [
    [0, 1, "b", ""], [2, 1, "x", ""],
    [1, 0, "s", A], [1, 1, "o", A], [1, 2, "", "empty cursor"], [1, 3, "n", A], [1, 4, "d", A],
    [2, 4, "o", A], [3, 4, "l", A], [4, 4, "p", B], [5, 4, "h", B], [6, 4, "i", B], [7, 4, "n", B],
    [5, 1, "f", ""], [5, 2, "i", ""], [5, 3, "s", ""],
  ];
  const board = document.getElementById("board");
  board.style.gridTemplateRows = "repeat(8, var(--cell-size))";
  for (const [r, c, ch, cls] of cells) {
    const el = document.createElement("div");
    el.className = ("cell " + cls).trim();
    el.style.gridRow = r + 1; el.style.gridColumn = c + 1;
    el.textContent = ch;
    board.appendChild(el);
  }
</script>
</body>
</html>
