# Word packs for Sound Box Crosswords. Packs show up in the order listed here.
#
# Each [[pack]] has:
#   id     short name used to save progress; don't change it once a pack is in use
#   name   label on the pack button
#   note   one short line shown under the buttons
#   words  one word per line, in this order (only the word is required):
#
#     ba-nan-a  🍌  (buh-nan-uh)  "We ate a banana."
#     word      picture  sounds   sentence
#
#     word      Dashes between syllables, split the way a teacher would clap. They drive
#               the syllable colors and "Break it down". Letters only (apostrophes OK: don't),
#               2–12 letters.
#     picture   One emoji that clearly shows the word. Leave it off if no emoji can show
#               it without misleading (their, would); the app shows a sound-wave icon.
#     sounds    Required for 2+ syllables: how "Break it down" should say each syllable, one
#               part per syllable. A syllable spoken alone is often misread ("vol" →
#               "volume", "ap" → "A P"), so use real words or 3+ letter spellings ("app",
#               "tell", "vahl"), and "uh" for the soft unstressed vowel. The boxes and the
#               whole-word speech keep the real spelling.
#     sentence  Required when there's no picture; optional otherwise. Must use the word.
#               Spoken for context (word, sentence, word), which also tells homophones
#               apart: their "The kids hung their coats on the hooks."
#               Also shown with the word as a blank, so don't use other words from the pack.
#
#   {sounds}  optional, last on the line: the word's sounds for Sound it out (editions with
#               sound_it_out), letters grouped by sound: cat 🐈 {c a t}, ship 🚢 {sh i p},
#               city {c=s i t y=ee}. See js/phonics.js. Leave it off sight words.
#   words_in_text = true   optional: lets this pack's words appear in its note and in each
#               other's sentences. Only for packs where spotting a printed word helps
#               (kindergarten high-frequency words); normally the check forbids it.
#
# This is the 3rd grade edition; editions.toml lists every grade's file.
# School units go first, newest at the top (add Unit 4 above Unit 3).
#
# Run `npm run check` after editing; it catches typos and builds test puzzles.

[[pack]]
id = "g3-2026-unit3"
name = "Unit 3"
note = "3rd grade 2026 school words. A sound wave means listen, then spell."
words = """
yard 🏡
storm ⛈️
more ➕
ex-plore 🧭 (ex-plore)
u-ni-form (you-nuh-form) "She wears her uniform to soccer practice."
third 🥉
germs 🦠
burn-ing 🔥 (burn-ing)
un-hurt (un-hurt) "He fell off his bike but was unhurt."
ob-serve (ub-zurv) "We observe the ants with a magnifying glass."
ex-it (eggs-it) "Walk to the exit by the front door."
stomp "The elephants stomp through the mud."
chick-en 🐔 (chick-in)
pub-lish (pub-lish) "Our class will publish a book of poems."
pan-ic 😱 (pan-ikk)
these "These shoes are too small for me."
don't "Please don't forget your lunch."
on-ly (own-lee) "I could find only one sock."
those "Those birds are flying south for the winter."
done "I am done with my homework."
"""

