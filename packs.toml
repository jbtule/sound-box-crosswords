# Word packs for Sound Box Crosswords. Packs show up in the order listed here.
#
# Each [[pack]] has:
#   id     short name used to save progress; don't change it once a pack is in use
#   name   label on the pack button
#   note   one short line shown under the buttons
#   words  one word per line: the word with dashes between syllables, a space, then an
#          emoji for the picture. Dashes drive the syllable colors and "Clap it", so split
#          words the way a teacher would clap them. Letters only, 2–12 letters.
#
# Run `npm run check` after editing; it catches typos and builds test puzzles.

[[pack]]
id = "blends"
name = "Blends"
note = "Two consonants side by side. Say both sounds: fr-og, ne-st."
words = """
